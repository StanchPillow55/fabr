<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fabr</title>
    <script>
      (function () {
        try {
          var r = document.documentElement;
          var t = JSON.parse(localStorage.getItem('fabr:theme') || 'null');
          var c = JSON.parse(localStorage.getItem('fabr:tint') || 'null');
          if (t === 'light' || t === 'dark') r.setAttribute('data-theme', t);
          if (typeof c === 'string' && /^[a-z]+$/.test(c)) r.setAttribute('data-tint', c);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
