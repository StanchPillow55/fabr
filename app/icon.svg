<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b0d1f"/>
      <stop offset="1" stop-color="#040510"/>
    </linearGradient>
    <linearGradient id="planet" x1="0.15" y1="0.05" x2="0.85" y2="0.95">
      <stop offset="0" stop-color="#22e6ff"/>
      <stop offset="0.5" stop-color="#2aa6ff"/>
      <stop offset="1" stop-color="#ff2bd6"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#19f0ff"/>
      <stop offset="1" stop-color="#ff2bb0"/>
    </linearGradient>
    <radialGradient id="shade" cx="0.32" cy="0.28" r="0.85">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.35"/>
    </radialGradient>
    <filter id="glowBig" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="34"/></filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="10"/></filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3"/></filter>
    <clipPath id="disc"><circle cx="512" cy="512" r="190"/></clipPath>
    <clipPath id="front"><rect x="0" y="512" width="1024" height="512"/></clipPath>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="181" ry="181" fill="url(#bg)"/>
  <g transform="rotate(-24 512 512)">
    <circle cx="512" cy="512" r="190" fill="url(#planet)" opacity="0.55" filter="url(#glowBig)"/>
    <ellipse cx="512" cy="512" rx="330" ry="104" fill="none" stroke="url(#ring)" stroke-width="30" opacity="0.6" filter="url(#glowBig)"/>
  </g>
  <g fill="#e9fbff">
    <circle cx="262" cy="256" r="9" filter="url(#soft)" opacity="0.9"/><circle cx="262" cy="256" r="5"/>
    <circle cx="776" cy="230" r="12" filter="url(#soft)" opacity="0.9"/><circle cx="776" cy="230" r="6"/>
    <circle cx="720" cy="804" r="8" filter="url(#soft)" opacity="0.8"/><circle cx="720" cy="804" r="4"/>
    <circle cx="300" cy="750" r="6" opacity="0.7"/>
  </g>
  <g transform="rotate(-24 512 512)">
    <ellipse cx="512" cy="512" rx="330" ry="104" fill="none" stroke="url(#ring)" stroke-width="26" opacity="0.9" filter="url(#glow)"/>
    <ellipse cx="512" cy="512" rx="330" ry="104" fill="none" stroke="url(#ring)" stroke-width="14"/>
    <circle cx="512" cy="512" r="190" fill="url(#planet)"/>
    <circle cx="512" cy="512" r="190" fill="url(#shade)"/>
    <circle cx="512" cy="512" r="190" fill="none" stroke="#dffcff" stroke-width="6" opacity="0.55"/>
    <g clip-path="url(#disc)"><ellipse cx="512" cy="512" rx="330" ry="104" fill="none" stroke="#06071a" stroke-width="56" clip-path="url(#front)" opacity="0.92"/></g>
    <ellipse cx="512" cy="512" rx="330" ry="104" fill="none" stroke="url(#ring)" stroke-width="26" opacity="0.9" filter="url(#glow)" clip-path="url(#front)"/>
    <ellipse cx="512" cy="512" rx="330" ry="104" fill="none" stroke="url(#ring)" stroke-width="14" clip-path="url(#front)"/>
    <ellipse cx="512" cy="512" rx="330" ry="104" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.5" clip-path="url(#front)"/>
  </g>
</svg>
